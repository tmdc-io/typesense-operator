controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    - --zap-log-level=debug
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: akyriako78/typesense-operator
      tag: 0.3.0
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
  replicas: 1
  serviceAccount:
    annotations: {}
imagePullSecrets: []
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
  serviceMonitor:
    enabled: false
    # kube-prometheus-stack selects ServiceMonitors by this label
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
    annotations: {}
    relabelings:
      - targetLabel: name
        replacement: "demo-typesense-operator"
    metricRelabelings: []

